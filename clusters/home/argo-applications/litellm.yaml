apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
spec:
  project: default
  # 공식 litellm helm chart(componentized). OCI 레지스트리 최신 배포판.
  # 구 litellm-helm(0.1.100)은 db-ready init 이미지가 템플릿에 하드코딩돼 있고 그 bitnami
  # 이미지가 docker.io에서 삭제(2025-08)돼 실행 불가라 이 chart로 이전.
  # LiteLLM API/관리 기능은 llm-serving의 단일 프로세스 monolith가 담당한다.
  # 이 chart는 UI와 기존 DB migration Job만 제공한다.
  source:
    # 1.92.0 chart pinned locally (upstream OCI digest sha256:8c2848bf145af849bb8a778b3c4a14dedc7329b19055721e50d7cf94630cc52e).
    # 단일 프로세스와 토큰 PVC는 manifests/llm-serving/litellm-monolith-candidate.yaml에서 관리.
    repoURL: https://github.com/ingtranet/argocd-manifests.git
    path: litellm
    targetRevision: HEAD
    helm:
      releaseName: litellm
      valuesObject:
        # 서비스 이름을 litellm-gateway / litellm-backend / litellm-ui 로 고정.
        fullnameOverride: litellm
        # DB 스키마 마이그레이션 — litellm-migrations 이미지로 PreSync(helm pre-install/upgrade) hook 실행.
        # ★egress 필수: prisma-python이 migrate 시 nodeenv로 Node.js(nodejs.org)를 받고 prisma CLI를
        # registry.npmjs.org에서 받는다. 이 두 호스트로 나가는 egress가 없으면 PreSync가 60s×4
        # 타임아웃→실패로 모든 sync를 무기한 블록한다(2026-07-21 방화벽 개방 후 정상화, ~30s에 완료).
        # binaries.prisma.sh는 엔진이 이미지 번들이라 불필요.
        migrationJob:
          enabled: true
          # Postgres TLS 비활성화: chart 1.92.0은 DATABASE_URL을 조립하지 않고(sslmode env도 없음)
          # entrypoint가 operator-pinned DATABASE_URL을 그대로 존중하므로 extraEnv pin이 유일한 수단.
          # $(VAR) 확장은 password를 percent-encode하지 않음 — 예약문자(@/?/%) 포함 시 URL 깨짐.
          extraEnv:
            - name: DATABASE_URL
              value: "postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)?sslmode=disable"
        # master key(=API 인증 토큰). 클러스터에 사전 주입한 Secret 재사용. chart가 gateway/backend에
        # LITELLM_MASTER_KEY로 주입하며, 이 chart는 lookup 없이 재생성하지 않고 Secret 참조만 하므로
        # 별도 ignoreDifferences 불필요(구 chart의 randAlphaNum 재생성 함정 없음).
        masterKey:
          secretName: litellm-masterkey
          secretKey: masterkey
        # 외부 Postgres — dagster/airflow와 동일 메타DB 인스턴스 postgresql.vd.ingtra.net 재사용.
        # DB 'litellm'은 사전 생성됨. 자격증명은 litellm-dbcreds(placeholder, system 계정) 재사용.
        database:
          writer:
            host: postgresql.vd.ingtra.net
            port: 5432
            dbname: litellm
            passwordSecret:
              name: litellm-dbcreds
              usernameKey: username
              passwordKey: password
        # redis 미사용(host 비우면 off). 번들 서브차트 아님(외부 연결 방식) — bitnami 의존 0.
        # cross-pod 코디네이션이 실제 필요해지면(virtual key rate limit) 공식 redis를 따로 띄워 host 지정.
        redis:
          host: ""
        # ---------- 이전 gateway: monolith 전환 후 비활성 ----------
        gateway:
          enabled: false
          numWorkers: 1
          tokenVolume:
            claimName: litellm-chatgpt-tokens
            mountPath: /var/lib/litellm/chatgpt
          # migrationJob과 동일한 DATABASE_URL pin(sslmode=disable). serverEnv가 DATABASE_*를
          # 먼저 emit하므로 $(VAR) 확장이 유효. raw password 인코딩 안 됨 — 예약문자 주의.
          extraEnv:
            - name: DATABASE_URL
              value: "postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)?sslmode=disable"
            - name: CHATGPT_TOKEN_DIR
              value: /var/lib/litellm/chatgpt
          # LITELLM_SALT_KEY(저장 크레덴셜 암호화) 주입. gateway/backend 모두 DB 암호문을 다루므로 양쪽에.
          envSecrets:
            - litellm-env
          config:
            create: true
            # 기존 model_list/settings 그대로 이전. api_key는 전부 dummy(내부 백엔드).
            # master key는 chart가 env로 주입하므로 general_settings.master_key 불필요.
            proxy_config:
              # 네임스페이스 규칙: local/=클러스터 내부 자체호스팅, jaeho/=jaeho 자체호스팅(외부),
              # openrouter/·nvidia_nim/·google_ai_studio/=클라우드 provider 와일드카드.
              model_list:
                # ── 로컬 임베딩 pplx-embed (Jetson primary, CPU fallback) ──
                # 기본 출력은 L2 정규화된 float. int8/binary/ubinary는 요청 body의
                # quantization 필드로 고를 수 있으나 litellm이 그 필드를 통과시키지
                # 않으므로, 필요하면 Service를 직접 호출할 것.
                - model_name: local/perplexity-ai/pplx-embed-v1-0.6b
                  litellm_params:
                    model: openai/perplexity-ai/pplx-embed-v1-0.6b
                    api_base: http://pplx-embed-v1-06b-jetson:8000/v1
                    api_key: dummy
                    max_parallel_requests: 8
                    # drop_params: true 상태에서 dimensions가 드롭되는 것을 확인
                    # (256을 보내도 1024 차원이 돌아옴). 이 모델에만 통과시킨다.
                    # encoding_format은 이 목록 없이도 그대로 전달된다(검증됨).
                    allowed_openai_params: ["dimensions"]
                - model_name: local/perplexity-ai/pplx-embed-v1-0.6b-cpu
                  litellm_params:
                    model: openai/perplexity-ai/pplx-embed-v1-0.6b
                    api_base: http://pplx-embed-v1-06b-cpu:8000/v1
                    api_key: dummy
                    max_parallel_requests: 8
                    # drop_params: true 상태에서 dimensions가 드롭되는 것을 확인
                    # (256을 보내도 1024 차원이 돌아옴). 이 모델에만 통과시킨다.
                    # encoding_format은 이 목록 없이도 그대로 전달된다(검증됨).
                    allowed_openai_params: ["dimensions"]
                # ── 사내 Mac Studio llama.cpp (OpenAI 호환, 무인증) ──
                # 10.2.0.x LAN 박스. 클러스터(10.3.x)에서 방화벽 개방 후 도달.
                # 장비별 고정 alias. llama.cpp 단일 모델 서버이므로 upstream model 값은 고정한다.
                - model_name: local/mac-studio/active
                  litellm_params:
                    model: openai/llama-server
                    api_base: http://10.2.0.49:38001/v1
                    api_key: dummy
                # 자동 비용 절감 라우팅: Mac Studio primary (retired OAuth fallback 없음).
                - model_name: auto/economy
                  litellm_params:
                    model: openai/llama-server
                    api_base: http://10.2.0.49:38001/v1
                    api_key: dummy
                # ── jaeho 자체호스팅 llama.cpp (Qwen3.6-27B, OpenAI 호환, 무인증, 외부 public) ──
                # 서버 슬러그는 바뀔 수 있음(naraninyeo 참고) — 현재 unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q4_K_XL.
                - model_name: jaeho/qwen/qwen3.6-27b
                  litellm_params:
                    model: openai/unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q4_K_XL
                    api_base: https://llm.jaehojang.cc/v1
                    api_key: dummy
                # Native ChatGPT OAuth routes are included in the subscription;
                # zero is incremental token pricing only, not the subscription fee.
                - model_name: chatgpt/gpt-5.5
                  litellm_params:
                    model: chatgpt/gpt-5.5
                  model_info:
                    input_cost_per_token: 0
                    output_cost_per_token: 0
                    pricing_is_custom: true
                    pricing_source: chatgpt-subscription-incremental-token-cost
                - model_name: chatgpt/gpt-6-luna
                  litellm_params:
                    model: chatgpt/gpt-6-luna
                  model_info:
                    input_cost_per_token: 0
                    output_cost_per_token: 0
                    pricing_is_custom: true
                    pricing_source: chatgpt-subscription-incremental-token-cost
                - model_name: chatgpt/gpt-6-sol
                  litellm_params:
                    model: chatgpt/gpt-6-sol
                  model_info:
                    input_cost_per_token: 0
                    output_cost_per_token: 0
                    pricing_is_custom: true
                    pricing_source: chatgpt-subscription-incremental-token-cost
                # Hypothetical OpenAI API-equivalent accounting only; these
                # rates are NOT the actual ChatGPT OAuth/subscription bill.
                - model_name: chatgpt/gpt-6-luna-priced
                  litellm_params:
                    model: chatgpt/gpt-6-luna
                  model_info:
                    input_cost_per_token: 0.0000001
                    cache_read_input_token_cost: 0.00000001
                    cache_creation_input_token_cost: 0.000000125
                    output_cost_per_token: 0.0000005
                    pricing_is_custom: true
                    pricing_source: openai-api-equivalent
                - model_name: chatgpt/gpt-6-sol-priced
                  litellm_params:
                    model: chatgpt/gpt-6-sol
                  model_info:
                    input_cost_per_token: 0.000002
                    cache_read_input_token_cost: 0.0000002
                    cache_creation_input_token_cost: 0.0000025
                    output_cost_per_token: 0.00001
                    pricing_is_custom: true
                    pricing_source: openai-api-equivalent
                # ── OpenRouter 전체(와일드카드, BYOK) ──
                - model_name: openrouter/*
                  litellm_params:
                    model: openrouter/*
                    api_key: os.environ/OPENROUTER_API_KEY
                # ── NVIDIA NIM 전체(와일드카드, 무료 티어, integrate.api.nvidia.com) ──
                - model_name: nvidia_nim/*
                  litellm_params:
                    model: nvidia_nim/*
                    api_key: os.environ/NVIDIA_API_KEY
                # ── Google AI Studio 전체(와일드카드) ──
                # 호출 이름 google_ai_studio/*를 실제 provider gemini/*에 매핑(* 대입):
                # google_ai_studio/gemini-2.5-flash → gemini/gemini-2.5-flash.
                # 키 이름도 litellm 기본(GEMINI_API_KEY)이 아니라 GOOGLE_AI_STUDIO_API_KEY라 명시 참조.
                - model_name: google_ai_studio/*
                  litellm_params:
                    model: gemini/*
                    api_key: os.environ/GOOGLE_AI_STUDIO_API_KEY
              litellm_settings:
                # false로 잠깐 바꿨다가 되돌림(2026-07-22) — 지원 안 되는 파라미터가
                # 에러로 드러나는 이점보다, 여러 provider 호출이 깨지는 손해가 컸다.
                # pplx-embed의 dimensions/encoding_format은 OpenAI 표준 파라미터라
                # true에서도 통과한다.
                drop_params: true
                set_verbose: false
              router_settings:
                num_retries: 0
                fallbacks:
                  - local/perplexity-ai/pplx-embed-v1-0.6b: ["local/perplexity-ai/pplx-embed-v1-0.6b-cpu"]
              # 프롬프트 로깅: 각 요청의 프롬프트+응답을 DB(LiteLLM_SpendLogs)에 저장 → admin UI Logs에서 조회.
              # spend logs 자체는 DB 연결 시 기본 ON, 이 옵션이 메시지 본문까지 저장. 민감정보 로깅 유의.
              general_settings:
                store_prompts_in_spend_logs: true
          service:
            port: 4000
          # gateway는 :4000 바인딩까지 ~50s+ 소요(모델 register+prisma+DB connect).
          # 이 chart는 startupProbe 미지원(템플릿에 gateway.livenessProbe/readinessProbe만 존재)이라
          # liveness initialDelaySeconds를 크게 잡아 slow-start vs liveness 레이스를 막는다.
          # (2026-07-21: 노드 4/5 NotReady로 startup이 51s까지 늘어 새 pod가 40s에 liveness-kill →
          #  crash-loop. 근본은 노드 복구지만 probe 여유로 방어.)
          livenessProbe:
            httpGet: {path: /health/liveliness, port: http}
            initialDelaySeconds: 120
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /health/readiness, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          # 홈 클러스터라 기본값(req cpu1/mem4Gi)에서 낮춤.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          # 헬시 노드 1개(2026-07-21 4/5 NotReady)뿐이라 3 replica는 낭비 → 1로 고정.
          hpa:
            enabled: true
            minReplicas: 1
            maxReplicas: 1
            targetCPUUtilizationPercentage: 70
            targetMemoryUtilizationPercentage: 80
        # ---------- 이전 backend: monolith 전환 후 비활성 ----------
        backend:
          enabled: false
          # 재활성화 전에는 native OAuth 기동 문제를 해결해야 한다.
          replicas: 0
          # migrationJob/gateway와 동일한 DATABASE_URL pin(sslmode=disable).
          extraEnv:
            - name: DATABASE_URL
              value: "postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)?sslmode=disable"
          envSecrets:
            - litellm-env
          service:
            port: 4001
          # gateway와 동일한 slow-startup vs liveness 레이스 방지(startupProbe 미지원 chart).
          # 600s liveness 유예도 startup을 살리지 못해 이전의 5분 값으로 복원한다.
          # 현재 chart backend는 replicas=0으로 quiesced; Service는 recovery Deployment가 담당.
          livenessProbe:
            httpGet: {path: /health/liveliness, port: http}
            initialDelaySeconds: 300
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /health/readiness, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          # backend는 1Gi에서 기동 중 OOMKilled(137) → 2Gi로 상향.
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          hpa:
            enabled: false
            minReplicas: 1
            maxReplicas: 2
            targetCPUUtilizationPercentage: 70
        # ---------- ui: Next.js 대시보드 ----------
        # 브라우저가 monolith를 같은 호스트(catch-all)로 호출하도록 backendUrl 지정.
        # chart 내장 ingress는 AWS ALB 전용이라 미사용(ingress.enabled=false 기본) — 노출은
        # Traefik IngressRoute(manifests/traefik-configs/litellm.yaml)에서 UI/API 경로 분기.
        ui:
          enabled: true
          backendUrl: https://litellm.ig.ingtra.net
          service:
            port: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: llm-serving
