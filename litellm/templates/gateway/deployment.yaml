{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "litellm.gateway.fullname" . }}
  labels:
    {{- include "litellm.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  selector:
    matchLabels:
      {{- include "litellm.gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.gateway.config.create }}
        checksum/config: {{ include (print $.Template.BasePath "/gateway/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "litellm.gateway.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "litellm.gateway.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.gateway.automount }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tokenVolume }}
      # NFS CSI creates the claim directory broadly accessible. The server's
      # All_Squash maps this process (UID 65532) to owner UID 1000.
      initContainers:
        - name: protect-chatgpt-tokens
          image: "{{ $.Values.gateway.image.repository }}:{{ $.Values.gateway.image.tag | default $.Chart.AppVersion }}"
          command: [python, -c, "import os,sys; os.chmod(sys.argv[1], 0o700)", {{ .mountPath | quote }}]
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: chatgpt-tokens
              mountPath: {{ .mountPath | quote }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            {{- include "litellm.serverEnv" (dict "root" $ "component" .Values.gateway) | nindent 12 }}
            {{- if .Values.gateway.config.create }}
            - name: CONFIG_FILE_PATH
              value: /app/config/config.yaml
            {{- end }}
            {{- if .Values.gateway.numWorkers }}
            - name: NUM_WORKERS
              value: {{ .Values.gateway.numWorkers | quote }}
            {{- end }}
          {{- include "litellm.envFrom" .Values.gateway | nindent 10 }}
          {{- if or .Values.gateway.config.create .Values.gateway.tokenVolume }}
          volumeMounts:
            {{- with .Values.gateway.tokenVolume }}
            - name: chatgpt-tokens
              mountPath: {{ .mountPath | quote }}
            {{- end }}
            {{- if .Values.gateway.config.create }}
            - name: gateway-config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
            {{- end }}
          {{- end }}
          {{- with .Values.gateway.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.gateway.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      {{- if or .Values.gateway.config.create .Values.gateway.tokenVolume }}
      volumes:
        {{- with .Values.gateway.tokenVolume }}
        - name: chatgpt-tokens
          persistentVolumeClaim:
            claimName: {{ .claimName | quote }}
        {{- end }}
        {{- if .Values.gateway.config.create }}
        - name: gateway-config
          configMap:
            name: {{ include "litellm.gateway.fullname" . }}-config
        {{- end }}
      {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
