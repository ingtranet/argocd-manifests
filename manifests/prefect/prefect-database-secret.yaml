apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: prefect-database
  namespace: prefect
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  data:
    # Established PostgreSQL credential keys used by the other home-cluster apps.
    - secretKey: postgres-system-user
      remoteRef:
        key: k8s/common/database
        property: postgres-system-user
    - secretKey: postgres-system-password
      remoteRef:
        key: k8s/common/database
        property: postgres-system-password
  target:
    name: prefect-database
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # The chart reads this complete URL through externalDatabase.*SecretKey.
        connection-string: >-
          postgresql+asyncpg://{{ index . "postgres-system-user" }}:{{ index . "postgres-system-password" }}@postgres.vd.ingtra.net:5432/prefect
