# Inject the real full SQLAlchemy asyncpg connection string out-of-band before
# syncing the Prefect Application. This placeholder intentionally contains no
# credential or external secret source.
apiVersion: v1
kind: Secret
metadata:
  name: prefect-database
  namespace: prefect
  annotations:
    argocd.argoproj.io/hook: Skip
type: Opaque
stringData:
  # Replace CHANGEME with the complete SQLAlchemy asyncpg connection string
  # out-of-band before the Prefect Application is synced.
  connection-string: CHANGEME
