apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-backend-recovery-config
  namespace: llm-serving
  labels:
    app.kubernetes.io/instance: llm-serving
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
data:
  config.yaml: |
    general_settings:
      store_prompts_in_spend_logs: true
    litellm_settings:
      drop_params: true
      set_verbose: false
    model_list:
    - litellm_params:
        allowed_openai_params:
        - dimensions
        api_base: http://pplx-embed-v1-06b-jetson:8000/v1
        api_key: dummy
        max_parallel_requests: 8
        model: openai/perplexity-ai/pplx-embed-v1-0.6b
      model_name: local/perplexity-ai/pplx-embed-v1-0.6b
    - litellm_params:
        allowed_openai_params:
        - dimensions
        api_base: http://pplx-embed-v1-06b-cpu:8000/v1
        api_key: dummy
        max_parallel_requests: 8
        model: openai/perplexity-ai/pplx-embed-v1-0.6b
      model_name: local/perplexity-ai/pplx-embed-v1-0.6b-cpu
    - litellm_params:
        api_base: http://flux2-klein-9b:8000/v1
        api_key: dummy
        mode: image_generation
        model: openai/black-forest-labs/FLUX.2-klein-9B
      model_name: local/black-forest-labs/flux.2-klein-9b
    - litellm_params:
        api_base: http://10.2.0.49:38001/v1
        api_key: dummy
        model: openai/llama-server
      model_name: local/mac-studio/active
    - litellm_params:
        api_base: http://10.2.0.49:38001/v1
        api_key: dummy
        model: openai/llama-server
      model_name: auto/economy
    - litellm_params:
        api_base: https://llm.jaehojang.cc/v1
        api_key: dummy
        model: openai/unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q4_K_XL
      model_name: jaeho/qwen/qwen3.6-27b
    - litellm_params:
        api_base: http://10.3.64.21:10531/v1
        api_key: dummy
        model: openai/*
      model_name: openai_oauth/openai/*
    - litellm_params:
        api_base: http://10.3.64.21:10531/v1
        api_key: dummy
        mode: image_generation
        model: openai/gpt-image-2
      model_name: openai_oauth/openai/gpt-image-2
    - litellm_params:
        api_key: os.environ/OPENROUTER_API_KEY
        model: openrouter/*
      model_name: openrouter/*
    - litellm_params:
        api_key: os.environ/NVIDIA_API_KEY
        model: nvidia_nim/*
      model_name: nvidia_nim/*
    - litellm_params:
        api_key: os.environ/GOOGLE_AI_STUDIO_API_KEY
        model: gemini/*
      model_name: google_ai_studio/*
    router_settings:
      fallbacks:
      - local/perplexity-ai/pplx-embed-v1-0.6b:
        - local/perplexity-ai/pplx-embed-v1-0.6b-cpu
      - auto/economy:
        - openai_oauth/openai/gpt-5.6-luna
      num_retries: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-backend-recovery
  namespace: llm-serving
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/name: litellm
    emergency-recovery: "true"
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  replicas: 1
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      emergency-recovery: "true"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: litellm
        app.kubernetes.io/name: litellm
        emergency-recovery: "true"
    spec:
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      serviceAccount: default
      serviceAccountName: default
      automountServiceAccountToken: true
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      containers:
      - name: backend
        image: ghcr.io/berriai/litellm-backend:v1.92.0
        imagePullPolicy: IfNotPresent
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        ports:
        - name: http
          containerPort: 4001
          protocol: TCP
        env:
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-masterkey
              key: masterkey
        - name: LITELLM_LOG
          value: INFO
        - name: DATABASE_HOST
          value: postgresql.vd.ingtra.net
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: litellm-dbcreds
              key: username
        - name: DATABASE_NAME
          value: litellm
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: litellm-dbcreds
              key: password
        - name: DISABLE_SCHEMA_UPDATE
          value: "true"
        - name: DATABASE_URL
          value: postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)?sslmode=disable
        - name: CONFIG_FILE_PATH
          value: /app/config/config.yaml
        envFrom:
        - secretRef:
            name: litellm-env
        volumeMounts:
        - name: gateway-config
          mountPath: /app/config/config.yaml
          subPath: config.yaml
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: http
            scheme: HTTP
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
      volumes:
      - name: gateway-config
        configMap:
          name: litellm-backend-recovery-config
          defaultMode: 420
